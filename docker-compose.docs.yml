services:
  docs:
    image: stayease_local_docs
    container_name: stayease_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - ./.envs/.local/.django
    volumes:
      - /app/.venv
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./stayease:/app/stayease:z
    ports:
      - '9000:9000'
    command: /start-docs
